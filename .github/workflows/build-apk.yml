name: Build VEXO Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - تحميل مشروع VEXO
      # ============================================================
      - name: Checkout VEXO
        uses: actions/checkout@v4


      # ============================================================
      # 2 - تحميل ملفات Pojav الأصلية
      # ============================================================
      - name: Get original PojavLauncher modules
        run: |
          set -e

          git clone --depth 1 --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle


      # ============================================================
      # 3 - Java
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 4 - Gradle
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'


      # ============================================================
      # 5 - ImageMagick
      # ============================================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ============================================================
      # 6 - العثور على صورة VEXO
      # ============================================================
      - name: Find VEXO logo
        run: |
          set -e

          echo "Searching for image files..."

          echo "Images in repository root:"
          find . -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
            -printf "%s bytes - %p\n" \
            | sort -nr

          # نختار أكبر صورة موجودة في جذر المستودع.
          # هذا يتجنب مشكلة الاسم العشوائي مثل file_000000....png
          ICON=$(find . -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
            -printf "%s %p\n" \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$ICON" ]; then
            echo "ERROR: No image found in repository root."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "VEXO IMAGE SELECTED:"
          echo "$ICON"
          echo "======================================"
          echo ""

          echo "VEXO_ICON=$ICON" >> "$GITHUB_ENV"


      # ============================================================
      # 7 - استبدال صورة Profile الخاصة بـ Pojav
      # ============================================================
      - name: Replace Pojav profile icon
        run: |
          set -e

          APP="app_pojavlauncher"
          RES="$APP/src/main/res"

          ICON="$VEXO_ICON"

          echo "Using image:"
          echo "$ICON"

          mkdir -p "$RES/drawable"

          # إنشاء صورة VEXO بحجم مناسب
          convert "$ICON" \
            -resize 512x512 \
            -gravity center \
            -background none \
            -extent 512x512 \
            "$RES/drawable/vexo_profile.png"

          echo "Created:"
          ls -lh "$RES/drawable/vexo_profile.png"


      # ============================================================
      # 8 - استبدال ic_pojav_full
      # ============================================================
      - name: Replace Pojav default icon
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"

          echo "Searching for ic_pojav_full..."

          FOUND=$(find "$RES" -type f \
            \( -iname "ic_pojav_full.png" \
               -o -iname "ic_pojav_full.webp" \
               -o -iname "ic_pojav_full.jpg" \
               -o -iname "ic_pojav_full.jpeg" \) \
            | head -n 1)

          if [ -n "$FOUND" ]; then

            echo "Found:"
            echo "$FOUND"

            rm -f "$FOUND"

            cp "$RES/drawable/vexo_profile.png" \
               "$RES/drawable/ic_pojav_full.png"

            echo "ic_pojav_full replaced with VEXO."

          else

            echo "ic_pojav_full was not found."

            echo "Searching all Pojav icons..."

            find "$RES" -type f \
              \( -iname "*pojav*" -o -iname "*profile*" \) \
              -print

            # إنشاء الملف حتى يكون متوفراً للكود
            cp "$RES/drawable/vexo_profile.png" \
               "$RES/drawable/ic_pojav_full.png"

            echo "Created new ic_pojav_full.png."

          fi


      # ============================================================
      # 9 - تعديل ProfileIconCache
      # ============================================================
      - name: Patch ProfileIconCache
        run: |
          set -e

          FILE="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          if [ -f "$FILE" ]; then

            echo "Patching ProfileIconCache.java"

            python3 <<'PY'
from pathlib import Path

file = Path(
    "app_pojavlauncher/src/main/java/"
    "net/kdt/pojavlaunch/profiles/ProfileIconCache.java"
)

text = file.read_text()

# استبدال صورة Pojav بصورة VEXO
text = text.replace(
    "R.drawable.ic_pojav_full",
    "R.drawable.vexo_profile"
)

file.write_text(text)

print("ProfileIconCache patched successfully.")
PY

          else

            echo "WARNING: ProfileIconCache.java not found."

          fi


      # ============================================================
      # 10 - استبدال أيقونة Android
      # ============================================================
      - name: Set VEXO Android app icon
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"
          ICON="$RES/drawable/vexo_profile.png"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$ICON" \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Android VEXO icon created."


      # ============================================================
      # 11 - اسم التطبيق
      # ============================================================
      - name: Set VEXO app name
        run: |
          set -e

          VALUES="app_pojavlauncher/src/main/res/values"

          mkdir -p "$VALUES"

          cat > "$VALUES/vexo_name.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="vexo_app_name">VEXO Launcher</string>
</resources>
EOF

          sed -i \
            's/android:label="@string\/app_name"/android:label="@string\/vexo_app_name"/' \
            app_pojavlauncher/src/main/AndroidManifest.xml

          echo "VEXO Launcher name applied."


      # ============================================================
      # 12 - التأكد من أن صورة VEXO موجودة
      # ============================================================
      - name: Verify VEXO files
        run: |
          set -e

          echo "======================================"
          echo "VEXO PROFILE"
          echo "======================================"

          ls -lh \
            app_pojavlauncher/src/main/res/drawable/vexo_profile.png

          echo ""

          echo "======================================"
          echo "POJAV DEFAULT ICON"
          echo "======================================"

          ls -lh \
            app_pojavlauncher/src/main/res/drawable/ic_pojav_full.png

          echo ""

          echo "======================================"
          echo "PROFILE CACHE"
          echo "======================================"

          grep -n "vexo_profile" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java \
            || true

          echo ""

          echo "======================================"
          echo "VERIFICATION COMPLETE"
          echo "======================================"


      # ============================================================
      # 13 - بناء APK
      # ============================================================
      - name: Build VEXO APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace


      # ============================================================
      # 14 - رفع APK
      # ============================================================
      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: "app_pojavlauncher/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
