name: Build VEXO Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout VEXO
        uses: actions/checkout@v4

      - name: Get original PojavLauncher modules
        run: |
          set -e

          git clone --depth 1 --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install ImageMagick and Pillow
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick python3-pil

      - name: Check VEXO red logo
        run: |
          set -e

          ICON="file_0000000081bc81f4b2f9275e96993131.png"

          echo "Checking VEXO red logo..."

          if [ ! -f "$ICON" ]; then
            echo "ERROR: VEXO red logo not found!"
            echo "Expected:"
            echo "$ICON"
            echo ""
            echo "Root files:"
            ls -lah
            exit 1
          fi

          echo "VEXO red logo found:"
          ls -lh "$ICON"

          file "$ICON"

          echo "VEXO_ICON=$ICON" >> "$GITHUB_ENV"

      - name: Create VEXO profile image
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"

          mkdir -p "$RES/drawable"

          convert "$VEXO_ICON" \
            -resize 512x512 \
            -gravity center \
            -background none \
            -extent 512x512 \
            "$RES/drawable/vexo_profile.png"

          echo "VEXO profile image created."

          ls -lh "$RES/drawable/vexo_profile.png"

      - name: Replace Pojav default profile icon
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"

          find "$RES" -type f \
            \( \
              -iname "ic_pojav_full.png" \
              -o -iname "ic_pojav_full.webp" \
              -o -iname "ic_pojav_full.jpg" \
              -o -iname "ic_pojav_full.jpeg" \
            \) \
            -delete

          cp \
            "$RES/drawable/vexo_profile.png" \
            "$RES/drawable/ic_pojav_full.png"

          echo "Pojav default profile icon replaced."

      - name: Patch ProfileIconCache
        run: |
          set -e

          FILE="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: ProfileIconCache.java not found."
            exit 1
          fi

          sed -i \
            's/R\.drawable\.ic_pojav_full/R.drawable.vexo_profile/g' \
            "$FILE"

          echo "ProfileIconCache patched."

          grep -n "vexo_profile" "$FILE" || true

      - name: Make Play button red
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"

          echo "Changing Play button from green to red..."

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("app_pojavlauncher/src/main/res")

          files = [
              root / "drawable" / "mine_button_focused.9.png",
              root / "drawable" / "mine_button_unfocused.9.png",
          ]

          for path in files:
              if not path.exists():
                  print("Not found:", path)
                  continue

              img = Image.open(path).convert("RGBA")
              pixels = img.load()

              for y in range(img.height):
                  for x in range(img.width):
                      r, g, b, a = pixels[x, y]

                      # Detect green pixels.
                      # White text and black 9-patch markers
                      # are preserved.
                      if g > 80 and g > r * 1.25 and g > b * 1.15:
                          brightness = max(r, g, b)

                          nr = min(255, max(120, int(brightness * 1.15)))
                          ng = max(0, int(g * 0.08))
                          nb = max(0, int(b * 0.08))

                          pixels[x, y] = (nr, ng, nb, a)

              img.save(path)

              print("Red button created:", path)

          PY

          echo "Play button is now red."

      - name: Replace remaining Pojav icon references
        run: |
          set -e

          JAVA_ROOT="app_pojavlauncher/src/main/java"

          grep -RIl \
            "R\.drawable\.ic_pojav_full" \
            "$JAVA_ROOT" \
            | while read FILE
            do
              sed -i \
                's/R\.drawable\.ic_pojav_full/R.drawable.vexo_profile/g' \
                "$FILE"
            done

      - name: Create VEXO Android app icon
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"
          ICON="$RES/drawable/vexo_profile.png"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$ICON" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "VEXO red Android icons created."

      - name: Set VEXO app name
        run: |
          set -e

          VALUES="app_pojavlauncher/src/main/res/values"

          mkdir -p "$VALUES"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="vexo_app_name">VEXO Launcher</string>' \
            '</resources>' \
            > "$VALUES/vexo_name.xml"

          MANIFEST="app_pojavlauncher/src/main/AndroidManifest.xml"

          sed -i \
            's/android:label="@string\/app_name"/android:label="@string\/vexo_app_name"/' \
            "$MANIFEST"

          echo "VEXO Launcher name applied."

      - name: Set VEXO manifest icon
        run: |
          set -e

          MANIFEST="app_pojavlauncher/src/main/AndroidManifest.xml"

          sed -i \
            's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/vexo_profile"/' \
            "$MANIFEST"

          sed -i \
            's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/vexo_profile"/' \
            "$MANIFEST"

          echo "VEXO manifest icon applied."

      - name: Verify VEXO modifications
        run: |
          set -e

          echo "======================================"
          echo "CHECK RED VEXO LOGO"
          echo "======================================"

          test -f \
            "file_0000000081bc81f4b2f9275e96993131.png"

          echo "Red VEXO logo OK."

          echo ""
          echo "======================================"
          echo "CHECK VEXO PROFILE"
          echo "======================================"

          test -f \
            "app_pojavlauncher/src/main/res/drawable/vexo_profile.png"

          echo "VEXO profile OK."

          echo ""
          echo "======================================"
          echo "CHECK DEFAULT PROFILE"
          echo "======================================"

          test -f \
            "app_pojavlauncher/src/main/res/drawable/ic_pojav_full.png"

          echo "Default profile icon OK."

          echo ""
          echo "======================================"
          echo "CHECK PLAY BUTTON"
          echo "======================================"

          test -f \
            "app_pojavlauncher/src/main/res/drawable/mine_button_focused.9.png"

          test -f \
            "app_pojavlauncher/src/main/res/drawable/mine_button_unfocused.9.png"

          echo "Red Play button files OK."

          echo ""
          echo "======================================"
          echo "CHECK PROFILE CODE"
          echo "======================================"

          grep -n \
            "vexo_profile" \
            "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          echo ""
          echo "======================================"
          echo "CHECK APP NAME"
          echo "======================================"

          test -f \
            "app_pojavlauncher/src/main/res/values/vexo_name.xml"

          echo "VEXO app name OK."

          echo ""
          echo "======================================"
          echo "ALL VEXO CHECKS PASSED"
          echo "======================================"

      - name: Build VEXO APK
        run: |
          set -e

          gradle :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK-RED
          path: "app_pojavlauncher/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
