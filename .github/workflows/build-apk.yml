name: Build VEXO Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout VEXO
        uses: actions/checkout@v4


      # ============================================================
      # GET ORIGINAL POJAV MODULES
      # ============================================================
      - name: Get original PojavLauncher modules
        run: |
          set -e

          git clone --depth 1 --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle


      # ============================================================
      # JAVA
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # GRADLE
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'


      # ============================================================
      # IMAGEMAGICK
      # ============================================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ============================================================
      # FIND VEXO IMAGE
      # ============================================================
      - name: Find VEXO logo
        run: |
          set -e

          echo "Searching for VEXO logo..."

          find . -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
            -print

          # يجب أن تكون صورة VEXO موجودة في جذر المستودع.
          # نبحث أولاً عن اسم يحتوي VEXO.
          ICON=$(find . -maxdepth 1 -type f \
            \( -iname "*vexo*.png" \
               -o -iname "*vexo*.jpg" \
               -o -iname "*vexo*.jpeg" \) \
            | head -n 1)

          if [ -z "$ICON" ]; then
            echo ""
            echo "ERROR: VEXO logo was not found."
            echo ""
            echo "Upload the VEXO logo to the ROOT of the GitHub repository."
            echo "The filename must contain VEXO."
            echo ""
            exit 1
          fi

          echo "======================================"
          echo "VEXO IMAGE FOUND:"
          echo "$ICON"
          echo "======================================"


      # ============================================================
      # REPLACE POJAV PROFILE ICON
      # ============================================================
      - name: Replace Pojav profile icon
        run: |
          set -e

          APP="app_pojavlauncher"
          RES="$APP/src/main/res"

          ICON=$(find . -maxdepth 1 -type f \
            \( -iname "*vexo*.png" \
               -o -iname "*vexo*.jpg" \
               -o -iname "*vexo*.jpeg" \) \
            | head -n 1)

          echo "Using VEXO image:"
          echo "$ICON"

          mkdir -p "$RES/drawable"

          # ----------------------------------------------------------
          # إنشاء صورة VEXO
          # ----------------------------------------------------------

          convert "$ICON" \
            -resize 512x512 \
            -gravity center \
            -background none \
            -extent 512x512 \
            "$RES/drawable/vexo_profile.png"

          # ----------------------------------------------------------
          # الأهم:
          # استبدال ic_pojav_full.png نفسه
          #
          # هذا هو الملف الذي يستخدمه Pojav للـ DEFAULT PROFILE.
          # ----------------------------------------------------------

          if [ -f "$RES/drawable/ic_pojav_full.png" ]; then

            cp "$RES/drawable/vexo_profile.png" \
               "$RES/drawable/ic_pojav_full.png"

            echo "SUCCESS:"
            echo "ic_pojav_full.png has been replaced by VEXO."

          else

            echo "ERROR:"
            echo "ic_pojav_full.png was not found."

            echo "Searching for Pojav icon files..."

            find "$RES" \
              -type f \
              \( -iname "*pojav*" -o -iname "*full*" \) \
              -print

            exit 1

          fi


      # ============================================================
      # ALSO PATCH ProfileIconCache.java
      # ============================================================
      - name: Patch ProfileIconCache
        run: |
          set -e

          FILE="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          if [ -f "$FILE" ]; then

            python3 <<'PY'
            from pathlib import Path

            file = Path(
                "app_pojavlauncher/src/main/java/"
                "net/kdt/pojavlaunch/profiles/ProfileIconCache.java"
            )

            text = file.read_text()

            old = "R.drawable.ic_pojav_full"
            new = "R.drawable.vexo_profile"

            if old in text:
                text = text.replace(old, new)
                file.write_text(text)
                print("ProfileIconCache patched.")
            else:
                print("ProfileIconCache already patched or reference not found.")
            PY

          else
            echo "WARNING: ProfileIconCache.java not found."
          fi


      # ============================================================
      # ANDROID APP ICON
      # ============================================================
      - name: Set VEXO Android app icon
        run: |
          set -e

          APP="app_pojavlauncher"
          RES="$APP/src/main/res"

          ICON="$RES/drawable/vexo_profile.png"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$ICON" \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Android VEXO icon created."


      # ============================================================
      # APP NAME
      # ============================================================
      - name: Set VEXO app name
        run: |
          set -e

          APP="app_pojavlauncher"
          VALUES="$APP/src/main/res/values"

          mkdir -p "$VALUES"

          cat > "$VALUES/vexo_name.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="vexo_app_name">VEXO Launcher</string>
          </resources>
          EOF

          sed -i \
            's/android:label="@string\/app_name"/android:label="@string\/vexo_app_name"/' \
            "$APP/src/main/AndroidManifest.xml"


      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify VEXO files
        run: |
          set -e

          echo "======================================"
          echo "VEXO PROFILE ICON"
          echo "======================================"

          ls -lh \
            app_pojavlauncher/src/main/res/drawable/vexo_profile.png

          echo ""

          echo "======================================"
          echo "POJAV DEFAULT ICON"
          echo "======================================"

          ls -lh \
            app_pojavlauncher/src/main/res/drawable/ic_pojav_full.png

          echo ""

          echo "======================================"
          echo "PROFILE CACHE"
          echo "======================================"

          grep -n "vexo_profile" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java \
            || true

          echo ""

          echo "======================================"
          echo "VEXO VERIFICATION COMPLETE"
          echo "======================================"


      # ============================================================
      # BUILD
      # ============================================================
      - name: Build VEXO APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace


      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: "app_pojavlauncher/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
