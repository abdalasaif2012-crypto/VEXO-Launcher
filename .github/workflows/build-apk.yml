name: Build VEXO Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout VEXO
        uses: actions/checkout@v4

      - name: Get original PojavLauncher v3_openjdk
        run: |
          set -e

          git clone --depth 1 \
            --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git \
            /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

      - name: Fix Android Gradle Plugin version
        run: |
          set -e

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle

      - name: Install ImageMagick and Pillow
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick python3-pil

      - name: Prepare VEXO logo
        run: |
          set -e

          ICON="file_0000000081bc81f4b2f9275e96993131.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: VEXO logo not found:"
            echo "$ICON"
            exit 1
          fi

          mkdir -p app_pojavlauncher/src/main/res/drawable

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("file_0000000081bc81f4b2f9275e96993131.png")
          target = Path(
              "app_pojavlauncher/src/main/res/drawable/vexo_profile.png"
          )

          img = Image.open(source).convert("RGBA")

          # Keep the logo square.
          size = min(img.width, img.height)

          left = (img.width - size) // 2
          top = (img.height - size) // 2

          img = img.crop(
              (left, top, left + size, top + size)
          )

          img.thumbnail((512, 512), Image.Resampling.LANCZOS)

          target.parent.mkdir(parents=True, exist_ok=True)
          img.save(target)

          print("Created:", target)
          PY

      - name: Replace Pojav profile icon with VEXO
        run: |
          set -e

          PROFILE_ICON="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          if [ ! -f "$PROFILE_ICON" ]; then
            echo "ERROR: ProfileIconCache.java not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"
          )

          text = path.read_text(encoding="utf-8")

          text2 = text.replace(
              "R.drawable.ic_pojav_full",
              "R.drawable.vexo_profile"
          )

          if text2 == text:
              print("WARNING: R.drawable.ic_pojav_full was not found.")
          else:
              path.write_text(text2, encoding="utf-8")
              print("Profile icon changed to VEXO.")

          PY

      - name: Create VEXO Android icons
        run: |
          set -e

          mkdir -p app_pojavlauncher/src/main/res/drawable

          mkdir -p app_pojavlauncher/src/main/res/mipmap-mdpi
          mkdir -p app_pojavlauncher/src/main/res/mipmap-hdpi
          mkdir -p app_pojavlauncher/src/main/res/mipmap-xhdpi
          mkdir -p app_pojavlauncher/src/main/res/mipmap-xxhdpi
          mkdir -p app_pojavlauncher/src/main/res/mipmap-xxxhdpi

          convert \
            file_0000000081bc81f4b2f9275e96993131.png \
            -resize 48x48 \
            app_pojavlauncher/src/main/res/mipmap-mdpi/ic_launcher.png

          convert \
            file_0000000081bc81f4b2f9275e96993131.png \
            -resize 72x72 \
            app_pojavlauncher/src/main/res/mipmap-hdpi/ic_launcher.png

          convert \
            file_0000000081bc81f4b2f9275e96993131.png \
            -resize 96x96 \
            app_pojavlauncher/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert \
            file_0000000081bc81f4b2f9275e96993131.png \
            -resize 144x144 \
            app_pojavlauncher/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert \
            file_0000000081bc81f4b2f9275e96993131.png \
            -resize 192x192 \
            app_pojavlauncher/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Set VEXO app name
        run: |
          set -e

          STRINGS="app_pojavlauncher/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS" ]; then
            echo "ERROR: strings.xml not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app_pojavlauncher/src/main/res/values/strings.xml"
          )

          text = path.read_text(encoding="utf-8")

          pattern = r'<string\s+name="app_name">.*?</string>'

          replacement = (
              '<string name="app_name">VEXO Launcher</string>'
          )

          new_text, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
              flags=re.DOTALL
          )

          if count == 0:
              print("WARNING: app_name was not found.")
          else:
              path.write_text(new_text, encoding="utf-8")
              print("App name changed to VEXO Launcher.")

          PY

      - name: Set Discord server
        run: |
          set -e

          STRINGS="app_pojavlauncher/src/main/res/values/strings.xml"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app_pojavlauncher/src/main/res/values/strings.xml"
          )

          text = path.read_text(encoding="utf-8")

          replacement_url = "https://discord.gg/K7MSmHZtf"

          pattern = r'(<string\s+name="discord_invite">).*?(</string>)'

          new_text, count = re.subn(
              pattern,
              lambda m: m.group(1) + replacement_url + m.group(2),
              text,
              count=1,
              flags=re.DOTALL
          )

          if count == 0:
              print("WARNING: discord_invite was not found.")
          else:
              path.write_text(new_text, encoding="utf-8")
              print("Discord server changed.")

          PY

      - name: Set VEXO application icon
        run: |
          set -e

          MANIFEST="app_pojavlauncher/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app_pojavlauncher/src/main/AndroidManifest.xml"
          )

          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/vexo_profile"',
              text,
              count=1
          )

          path.write_text(text, encoding="utf-8")

          print("Manifest icon changed to VEXO.")
          PY

      - name: Make Play button red
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path(
              "app_pojavlauncher/src/main/res"
          )

          files = [
              root / "drawable" / "mine_button_focused.9.png",
              root / "drawable" / "mine_button_unfocused.9.png",
          ]

          for path in files:

              if not path.exists():
                  print("Not found:", path)
                  continue

              img = Image.open(path).convert("RGBA")

              pixels = img.load()

              for y in range(img.height):
                  for x in range(img.width):

                      r, g, b, a = pixels[x, y]

                      if (
                          g > 80
                          and g > r * 1.25
                          and g > b * 1.15
                      ):

                          brightness = max(r, g, b)

                          nr = min(
                              255,
                              max(
                                  120,
                                  int(brightness * 1.15)
                              )
                          )

                          ng = max(
                              0,
                              int(g * 0.08)
                          )

                          nb = max(
                              0,
                              int(b * 0.08)
                          )

                          pixels[x, y] = (
                              nr,
                              ng,
                              nb,
                              a
                          )

              img.save(path)

              print(
                  "Play button made red:",
                  path
              )

          PY

      - name: Verify branding
        run: |
          set -e

          echo "========== VEXO CHECK =========="

          test -f \
            app_pojavlauncher/src/main/res/drawable/vexo_profile.png

          grep -R \
            "vexo_profile" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java

          grep -R \
            "VEXO Launcher" \
            app_pojavlauncher/src/main/res/values/strings.xml

          grep -R \
            "K7MSmHZtf" \
            app_pojavlauncher/src/main/res/values/strings.xml

          grep -R \
            'android:icon="@drawable/vexo_profile"' \
            app_pojavlauncher/src/main/AndroidManifest.xml

          echo "================================"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build VEXO APK
        run: |
          set -e

          gradle \
            :app_pojavlauncher:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: |
            app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
