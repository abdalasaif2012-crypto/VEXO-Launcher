name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VEXO
        uses: actions/checkout@v4

      - name: Get original PojavLauncher modules
        run: |
          git clone --depth 1 --branch v3_openjdk https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" app_pojavlauncher/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Show Gradle projects
        run: |
          gradle projects

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: "app_pojavlauncher/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
