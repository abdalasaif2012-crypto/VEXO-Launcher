name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VEXO
        uses: actions/checkout@v4

      - name: Get original PojavLauncher modules
        run: |
          git clone --depth 1 --branch v3_openjdk https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" app_pojavlauncher/build.gradle

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Replace launcher icon with VEXO logo
        run: |
          set -e

          echo "Searching for VEXO PNG..."

          ICON=$(find . -maxdepth 1 -type f -iname "*.png" | head -n 1)

          if [ -z "$ICON" ]; then
            echo "ERROR: No PNG file found in repository root."
            exit 1
          fi

          echo "Using icon: $ICON"

          RES="app_pojavlauncher/src/main/res"

          echo "Removing old Pojav launcher icons..."

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"

          rm -f "$RES"/mipmap-*/ic_launcher.png
          rm -f "$RES"/mipmap-*/ic_launcher_round.png

          echo "Creating VEXO launcher icon folders..."

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo "Generating launcher icons..."

          convert "$ICON" -auto-orient -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" -auto-orient -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" -auto-orient -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" -auto-orient -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" -auto-orient -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo "Creating round launcher icons..."

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "VEXO icon replacement completed."

          echo "Checking generated icons..."

          find "$RES" -type f \( \
            -name "ic_launcher.png" -o \
            -name "ic_launcher_round.png" \
          \) -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Show Gradle projects
        run: |
          gradle projects

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: "app_pojavlauncher/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
