name: Build VEXO Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. تحميل مستودع VEXO
      # ============================================================
      - name: Checkout VEXO
        uses: actions/checkout@v4


      # ============================================================
      # 2. تحميل ملفات Pojav الأصلية
      # ============================================================
      - name: Get original PojavLauncher modules
        run: |
          set -e

          git clone --depth 1 --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle


      # ============================================================
      # 3. Java
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 4. Gradle
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'


      # ============================================================
      # 5. ImageMagick
      # ============================================================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ============================================================
      # 6. تجهيز صورة VEXO
      # ============================================================
      - name: Prepare VEXO logo
        run: |
          set -e

          APP="app_pojavlauncher"
          RES="$APP/src/main/res"

          mkdir -p "$RES/drawable"

          echo "Searching for VEXO PNG..."

          # نبحث عن أكبر PNG في جذر المشروع.
          # صورة VEXO الأصلية عالية الدقة، لذلك نستخدمها
          # بدلاً من ic_modrinth أو صور صغيرة أخرى.
          ICON=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.png" \
            -printf "%s %p\n" \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$ICON" ]; then
            echo "ERROR: No PNG image found in repository root."
            exit 1
          fi

          echo "VEXO logo selected:"
          echo "$ICON"

          # إنشاء نسخة داخل drawable
          convert "$ICON" \
            -resize 512x512 \
            -gravity center \
            -background none \
            -extent 512x512 \
            "$RES/drawable/vexo_profile.png"

          echo "VEXO profile icon created."


      # ============================================================
      # 7. إصلاح أيقونة الـ PROFILE نفسها
      #
      # Pojav يستخدم:
      #
      # ProfileIconCache.java
      #
      # والـ default profile يستخدم:
      #
      # R.drawable.ic_pojav_full
      #
      # نحن نستبدلها بـ:
      #
      # R.drawable.vexo_profile
      # ============================================================
      - name: Replace Pojav default profile icon
        run: |
          set -e

          PROFILE_FILE="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          if [ ! -f "$PROFILE_FILE" ]; then
            echo "ERROR: ProfileIconCache.java not found."
            exit 1
          fi

          echo "Patching:"
          echo "$PROFILE_FILE"

          python3 <<'PY'
          from pathlib import Path

          file = Path(
              "app_pojavlauncher/src/main/java/"
              "net/kdt/pojavlaunch/profiles/ProfileIconCache.java"
          )

          text = file.read_text()

          old = "R.drawable.ic_pojav_full"
          new = "R.drawable.vexo_profile"

          if old not in text:
              print("WARNING: ic_pojav_full reference was not found.")
              print("The file may already be patched.")
          else:
              text = text.replace(old, new)
              file.write_text(text)
              print("SUCCESS: Default profile icon replaced with VEXO.")
          PY

          echo "Checking patched source..."

          grep -n "vexo_profile" "$PROFILE_FILE" || {
            echo "ERROR: VEXO profile icon patch failed."
            exit 1
          }


      # ============================================================
      # 8. أيضاً نستبدل أيقونة التطبيق Android
      # ============================================================
      - name: Set VEXO Android application icon
        run: |
          set -e

          APP="app_pojavlauncher"
          RES="$APP/src/main/res"

          ICON="$RES/drawable/vexo_profile.png"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$ICON" \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Android VEXO icon created."


      # ============================================================
      # 9. اسم التطبيق
      # ============================================================
      - name: Set VEXO app name
        run: |
          set -e

          APP="app_pojavlauncher"
          VALUES="$APP/src/main/res/values"

          mkdir -p "$VALUES"

          cat > "$VALUES/vexo_name.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="vexo_app_name">VEXO Launcher</string>
          </resources>
          EOF

          sed -i \
            's/android:label="@string\/app_name"/android:label="@string\/vexo_app_name"/' \
            "$APP/src/main/AndroidManifest.xml"

          echo "Application name changed to VEXO Launcher."


      # ============================================================
      # 10. فحص نهائي قبل البناء
      # ============================================================
      - name: Verify VEXO modifications
        run: |
          set -e

          echo "======================================"
          echo "VEXO PROFILE ICON"
          echo "======================================"

          grep -n "vexo_profile" \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java

          echo ""
          echo "======================================"
          echo "VEXO IMAGE"
          echo "======================================"

          ls -lh \
            app_pojavlauncher/src/main/res/drawable/vexo_profile.png

          echo ""
          echo "======================================"
          echo "ANDROID ICON"
          echo "======================================"

          ls -lh app_pojavlauncher/src/main/res/mipmap-*/ic_launcher.png

          echo ""
          echo "======================================"
          echo "VERIFY COMPLETE"
          echo "======================================"


      # ============================================================
      # 11. Build APK
      # ============================================================
      - name: Build VEXO APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace


      # ============================================================
      # 12. رفع APK
      # ============================================================
      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: "app_pojavlauncher/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
