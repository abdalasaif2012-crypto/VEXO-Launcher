
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Inspect source
        run: |
          echo "===== ZIP CONTENTS ====="
          unzip -l src.zip | head -200
          echo "===== EXTRACT ====="
          unzip -o src.zip
          echo "===== BUILD FILES ====="
          find . -maxdepth 6 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" \) -print
          echo "===== DIRECTORIES ====="
          find . -maxdepth 4 -type d -print | head -200

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Show Gradle projects
        run: |
          gradle projects

      - name: Build APK
        run: |
          gradle :app_pojavlauncher:tasks --all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: "**/*.apk"
          if-no-files-found: ignore
