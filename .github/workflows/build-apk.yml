name: Build VEXO Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout VEXO
        uses: actions/checkout@v4


      - name: Get original PojavLauncher modules
        run: |
          set -e

          git clone --depth 1 --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git \
            /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle


      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      - name: Apply VEXO branding
        run: |
          set -e

          APP="app_pojavlauncher"
          RES="$APP/src/main/res"

          echo "=============================="
          echo "       VEXO BRANDING"
          echo "=============================="

          echo "Searching for VEXO logo..."

          ICON=$(find . -maxdepth 1 -type f -iname "*.png" \
            ! -iname "ic_modrinth.png" \
            ! -iname "ic_launcher.png" \
            ! -iname "ic_launcher_round.png" \
            | head -n 1)

          if [ -z "$ICON" ]; then
            echo "ERROR: VEXO PNG was not found."
            echo "PNG files in repository:"
            find . -maxdepth 1 -type f -iname "*.png" -print
            exit 1
          fi

          echo "Using VEXO icon: $ICON"


          echo "Creating VEXO launcher icon..."

          mkdir -p "$RES/drawable"

          convert "$ICON" \
            -resize 512x512 \
            "$RES/drawable/vexo_launcher.png"


          echo "Creating VEXO app name..."

          mkdir -p "$RES/values"

          cat > "$RES/values/vexo_branding.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="vexo_app_name">VEXO Launcher</string>
          </resources>
          EOF


          echo "Changing Android manifest..."

          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "app_pojavlauncher/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="@string/vexo_app_name"'
          )

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/vexo_launcher"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/vexo_launcher"'
          )

          manifest.write_text(text)

          print("Manifest updated.")
          PY


          echo "Fixing Java launcher icon references..."

          python3 <<'PY'
          from pathlib import Path

          java_root = Path(
              "app_pojavlauncher/src/main/java"
          )

          for file in java_root.rglob("*.java"):

              text = file.read_text()

              new_text = text.replace(
                  "R.mipmap.ic_launcher",
                  "R.drawable.vexo_launcher"
              )

              new_text = new_text.replace(
                  "R.mipmap.ic_launcher_round",
                  "R.drawable.vexo_launcher"
              )

              if new_text != text:
                  file.write_text(new_text)
                  print("Fixed:", file)
          PY


          echo "=============================="
          echo "Checking VEXO icon..."
          echo "=============================="

          ls -lh "$RES/drawable/vexo_launcher.png"


          echo "=============================="
          echo "Checking manifest..."
          echo "=============================="

          grep -n \
            "android:label\|android:icon\|android:roundIcon" \
            "$APP/src/main/AndroidManifest.xml"


          echo "=============================="
          echo "VEXO BRANDING COMPLETE"
          echo "=============================="


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'


      - name: Show Gradle projects
        run: |
          gradle projects


      - name: Build VEXO APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace


      - name: Rename APK
        run: |
          set -e

          APK=$(find \
            app_pojavlauncher/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          cp "$APK" VEXO-Launcher.apk

          echo "=============================="
          echo "VEXO APK CREATED"
          echo "=============================="

          ls -lh VEXO-Launcher.apk


      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher
          path: VEXO-Launcher.apk
          if-no-files-found: error
