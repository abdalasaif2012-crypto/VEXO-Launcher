name: Build VEXO Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. Checkout VEXO
      # =========================================
      - name: Checkout VEXO
        uses: actions/checkout@v4


      # =========================================
      # 2. Get original PojavLauncher modules
      # =========================================
      - name: Get original PojavLauncher modules
        run: |
          set -e

          git clone --depth 1 --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle


      # =========================================
      # 3. Java
      # =========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================
      # 4. Gradle
      # =========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'


      # =========================================
      # 5. ImageMagick
      # =========================================
      - name: Install ImageMagick
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick


      # =========================================
      # 6. Check VEXO logo
      # =========================================
      - name: Check VEXO logo
        run: |
          set -e

          ICON="file_00000000d6bc820aa23529b647d9b47f.png"

          echo "Checking VEXO logo..."
          echo "Using:"
          echo "$ICON"

          if [ ! -f "$ICON" ]; then
            echo "======================================"
            echo "ERROR: VEXO logo NOT FOUND"
            echo "======================================"
            echo ""
            echo "Expected file:"
            echo "$ICON"
            echo ""
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo ""
          echo "VEXO logo found successfully."

          file "$ICON"
          ls -lh "$ICON"

          echo "VEXO_ICON=$ICON" >> "$GITHUB_ENV"


      # =========================================
      # 7. Create VEXO profile image
      # =========================================
      - name: Create VEXO profile image
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"

          mkdir -p "$RES/drawable"

          echo "Creating VEXO profile image..."

          convert "$VEXO_ICON" \
            -resize 512x512 \
            -gravity center \
            -background none \
            -extent 512x512 \
            "$RES/drawable/vexo_profile.png"

          echo ""
          echo "VEXO profile image created."

          file "$RES/drawable/vexo_profile.png"
          ls -lh "$RES/drawable/vexo_profile.png"


      # =========================================
      # 8. Replace Pojav default profile icon
      # =========================================
      - name: Replace Pojav default profile icon
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"

          echo "Searching for Pojav default profile icon..."

          find "$RES" -type f \
            \( \
              -iname "ic_pojav_full.png" \
              -o -iname "ic_pojav_full.webp" \
              -o -iname "ic_pojav_full.jpg" \
              -o -iname "ic_pojav_full.jpeg" \
            \) \
            -print

          find "$RES" -type f \
            \( \
              -iname "ic_pojav_full.png" \
              -o -iname "ic_pojav_full.webp" \
              -o -iname "ic_pojav_full.jpg" \
              -o -iname "ic_pojav_full.jpeg" \
            \) \
            -delete

          cp \
            "$RES/drawable/vexo_profile.png" \
            "$RES/drawable/ic_pojav_full.png"

          echo ""
          echo "Pojav default profile icon replaced."

          ls -lh \
            "$RES/drawable/ic_pojav_full.png"


      # =========================================
      # 9. Patch ProfileIconCache
      # =========================================
      - name: Patch ProfileIconCache
        run: |
          set -e

          FILE="app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: ProfileIconCache.java not found."
            exit 1
          fi

          echo "Patching ProfileIconCache.java..."

          sed -i \
            's/R\.drawable\.ic_pojav_full/R.drawable.vexo_profile/g' \
            "$FILE"

          echo ""
          echo "ProfileIconCache after patch:"

          grep -n \
            "vexo_profile" \
            "$FILE" || true


      # =========================================
      # 10. Replace remaining Pojav profile references
      # =========================================
      - name: Replace remaining Pojav profile references
        run: |
          set -e

          JAVA_ROOT="app_pojavlauncher/src/main/java"

          echo "Searching for remaining ic_pojav_full references..."

          grep -RIn \
            "R\.drawable\.ic_pojav_full" \
            "$JAVA_ROOT" \
            || true

          grep -RIl \
            "R\.drawable\.ic_pojav_full" \
            "$JAVA_ROOT" \
            | while read FILE
            do
              echo "Patching:"
              echo "$FILE"

              sed -i \
                's/R\.drawable\.ic_pojav_full/R.drawable.vexo_profile/g' \
                "$FILE"
            done

          echo ""
          echo "Remaining references:"

          grep -RIn \
            "R\.drawable\.ic_pojav_full" \
            "$JAVA_ROOT" \
            || true


      # =========================================
      # 11. Create VEXO Android launcher icons
      # =========================================
      - name: Create VEXO Android app icon
        run: |
          set -e

          RES="app_pojavlauncher/src/main/res"

          ICON="$RES/drawable/vexo_profile.png"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$ICON" \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "VEXO Android launcher icons created."


      # =========================================
      # 12. Set VEXO app name
      # =========================================
      - name: Set VEXO app name
        run: |
          set -e

          VALUES="app_pojavlauncher/src/main/res/values"

          mkdir -p "$VALUES"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="vexo_app_name">VEXO Launcher</string>' \
            '</resources>' \
            > "$VALUES/vexo_name.xml"

          MANIFEST="app_pojavlauncher/src/main/AndroidManifest.xml"

          sed -i \
            's/android:label="@string\/app_name"/android:label="@string\/vexo_app_name"/' \
            "$MANIFEST"

          echo "VEXO Launcher name applied."


      # =========================================
      # 13. Set VEXO Android manifest icon
      # =========================================
      - name: Set VEXO manifest icon
        run: |
          set -e

          MANIFEST="app_pojavlauncher/src/main/AndroidManifest.xml"

          echo "Patching AndroidManifest.xml..."

          sed -i \
            's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/vexo_profile"/' \
            "$MANIFEST"

          sed -i \
            's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/vexo_profile"/' \
            "$MANIFEST"

          echo ""
          echo "Manifest settings:"

          grep -n \
            'android:icon\|android:roundIcon\|android:label' \
            "$MANIFEST"


      # =========================================
      # 14. Search all remaining Pojav icon references
      # =========================================
      - name: Check remaining Pojav icon references
        run: |
          set -e

          echo "Searching for Pojav icon references..."

          grep -RIn \
            "ic_pojav_full\|pojavlauncher" \
            app_pojavlauncher/src/main/java \
            app_pojavlauncher/src/main/res \
            || true

          echo ""
          echo "Search completed."


      # =========================================
      # 15. Verify VEXO modifications
      # =========================================
      - name: Verify VEXO modifications
        run: |
          set -e

          echo "======================================"
          echo "CHECK VEXO LOGO"
          echo "======================================"

          test -f \
            "file_00000000d6bc820aa23529b647d9b47f.png"

          echo "VEXO logo OK."


          echo ""
          echo "======================================"
          echo "CHECK VEXO PROFILE"
          echo "======================================"

          test -f \
            "app_pojavlauncher/src/main/res/drawable/vexo_profile.png"

          echo "VEXO profile OK."


          echo ""
          echo "======================================"
          echo "CHECK DEFAULT PROFILE ICON"
          echo "======================================"

          test -f \
            "app_pojavlauncher/src/main/res/drawable/ic_pojav_full.png"

          echo "Default profile icon OK."


          echo ""
          echo "======================================"
          echo "CHECK PROFILE CODE"
          echo "======================================"

          grep -n \
            "vexo_profile" \
            "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/profiles/ProfileIconCache.java"

          echo "Profile code OK."


          echo ""
          echo "======================================"
          echo "CHECK APP NAME"
          echo "======================================"

          test -f \
            "app_pojavlauncher/src/main/res/values/vexo_name.xml"

          echo "VEXO app name OK."


          echo ""
          echo "======================================"
          echo "CHECK MANIFEST"
          echo "======================================"

          grep -n \
            'android:icon\|android:roundIcon\|android:label' \
            "app_pojavlauncher/src/main/AndroidManifest.xml"


          echo ""
          echo "======================================"
          echo "ALL VEXO CHECKS PASSED"
          echo "======================================"


      # =========================================
      # 16. Build VEXO APK
      # =========================================
      - name: Build VEXO APK
        run: |
          set -e

          gradle :app_pojavlauncher:assembleDebug --stacktrace


      # =========================================
      # 17. Upload APK
      # =========================================
      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: "app_pojavlauncher/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
