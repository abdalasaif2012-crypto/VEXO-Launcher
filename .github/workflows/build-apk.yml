name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract src.zip
        run: |
          unzip -o src.zip
          find . -maxdepth 3 -name build.gradle -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          gradle :app_pojavlauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
