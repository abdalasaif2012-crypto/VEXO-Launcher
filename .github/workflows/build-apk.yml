name: Build VEXO Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VEXO
        uses: actions/checkout@v4

      - name: Get original PojavLauncher modules
        run: |
          set -e

          git clone --depth 1 --branch v3_openjdk \
            https://github.com/PojavLauncherTeam/PojavLauncher.git \
            /tmp/pojav

          rm -rf app_pojavlauncher
          rm -rf arc_dns_injector
          rm -rf forge_installer
          rm -rf jre_lwjgl3glfw

          cp -a /tmp/pojav/app_pojavlauncher .
          cp -a /tmp/pojav/arc_dns_injector .
          cp -a /tmp/pojav/forge_installer .
          cp -a /tmp/pojav/jre_lwjgl3glfw .

          sed -i \
            "s/com.android.application' version '8.7.2'/com.android.application' version '8.11.1'/" \
            app_pojavlauncher/build.gradle

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Apply VEXO branding
        run: |
          set -e

          APP="app_pojavlauncher"
          RES="$APP/src/main/res"

          echo "=============================="
          echo "       VEXO BRANDING"
          echo "=============================="

          # Find VEXO PNG in repository root
          ICON=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.PNG" \) | head -n 1)

          if [ -z "$ICON" ]; then
            echo "ERROR: VEXO PNG was not found in repository root."
            exit 1
          fi

          echo "Using icon: $ICON"

          # --------------------------------------------------
          # 1. Create launcher icon resources
          # --------------------------------------------------

          rm -rf "$RES/mipmap-mdpi"
          rm -rf "$RES/mipmap-hdpi"
          rm -rf "$RES/mipmap-xhdpi"
          rm -rf "$RES/mipmap-xxhdpi"
          rm -rf "$RES/mipmap-xxxhdpi"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          convert "$ICON" -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          # Remove adaptive-icon XML files if they exist.
          # This forces Android to use the VEXO PNG resources.
          rm -rf "$RES/mipmap-anydpi-v26"

          # --------------------------------------------------
          # 2. Change application name
          # --------------------------------------------------

          mkdir -p "$RES/values"

          cat > "$RES/values/vexo_branding.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="vexo_app_name">VEXO Launcher</string>
          </resources>
          EOF

          # Replace the application label in the manifest.
          sed -i \
            's/android:label="@string/app_name"/android:label="@string\/vexo_app_name"/' \
            "$APP/src/main/AndroidManifest.xml"

          # --------------------------------------------------
          # 3. Make sure manifest uses the VEXO icon
          # --------------------------------------------------

          sed -i \
            's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/' \
            "$APP/src/main/AndroidManifest.xml"

          sed -i \
            's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/ic_launcher_round"/' \
            "$APP/src/main/AndroidManifest.xml"

          # --------------------------------------------------
          # 4. Fix Java references to the launcher icon
          # --------------------------------------------------

          grep -RIl 'R\.mipmap\.ic_launcher' "$APP/src/main/java" 2>/dev/null | while read FILE
          do
            echo "Fixing icon reference in: $FILE"
            sed -i 's/R\.mipmap\.ic_launcher/R.mipmap.ic_launcher/g' "$FILE"
          done

          echo "VEXO branding applied."

          echo "Checking icons:"
          find "$RES" -type f \( \
            -name "ic_launcher.png" -o \
            -name "ic_launcher_round.png" \
          \) -print

          echo "Checking manifest:"
          grep -n "android:label\|android:icon\|android:roundIcon" \
            "$APP/src/main/AndroidManifest.xml"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Show Gradle projects
        run: |
          gradle projects

      - name: Build VEXO APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          set -e

          APK=$(find app_pojavlauncher/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          cp "$APK" VEXO-Launcher.apk

          echo "Created:"
          ls -lh VEXO-Launcher.apk

      - name: Upload VEXO APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXO-Launcher
          path: VEXO-Launcher.apk
          if-no-files-found: error
